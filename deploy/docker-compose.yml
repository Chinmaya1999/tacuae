name: tac

x-site: &site
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  mem_limit: 256m
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  networks: [web]

x-mail: &mail
  TRUST_PROXY: "true"
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  ENQUIRY_TO: ${ENQUIRY_TO:-info@tacuae.com}

services:
  tac-c:
    <<: *site
    image: ${DOCKERHUB_USER}/tac-site-c:${TAG_C:-latest}
    environment: { <<: *mail, ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}", ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@tacuae.com}", MONGODB_URI: "${MONGODB_URI:-}", DEMO_MODE: "${DEMO_MODE:-false}", DEMO_PASSWORD: "${DEMO_PASSWORD:-}", DATA_DIR: "${APP_DATA_DIR:-/data}" }
    volumes: ["c_data:/data"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports: ["80:80", "443:443", "8082:8082"] # 80/443 are used only once a domain is set in C_SITE
    environment:
      C_SITE: ${C_SITE:-http://:8082}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      tac-c: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    networks: [web]

networks: { web: {} }
volumes: { c_data: {}, caddy_data: {}, caddy_config: {} }
