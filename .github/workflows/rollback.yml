name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to roll back to (e.g. sha-1a2b3c4 — see Docker Hub or an earlier run)"
        required: true

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency: { group: production-deploy, cancel-in-progress: false }
    steps:
      - name: Validate input
        env: { TAG: "${{ github.event.inputs.tag }}" }
        run: '[[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid tag"; exit 1; }'
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ssh-setup
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Roll back
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          # shellcheck disable=SC2029  # TAG validated against ^[A-Za-z0-9._-]+$ in the first step
          ssh target "bash /opt/tac/deploy.sh TAG_C=$TAG"
