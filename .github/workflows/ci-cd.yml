# Checks run side by side and only COUNT errors; the release continues. It stops only when the site cannot work:
# the app does not build, the container does not start, or the new version is unhealthy on the server (auto rollback).
# Set the repository variable BLOCK_ON_ERRORS=true to also stop deployment while any check fails.
name: CI/CD

on:
  push: { branches: [main], paths-ignore: ["docs/**", "**/*.md"] }
  pull_request: { branches: [main] }
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First run only: install Docker and prepare the server"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_USER: ${{ vars.DOCKERHUB_USERNAME || 'awsmallick1999' }}
  IMAGE: tac-site-c # kept so earlier image tags stay available for rollback

defaults:
  run: { shell: bash, working-directory: app }

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: app/.nvmrc, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - name: Type check
        if: ${{ !cancelled() }}
        continue-on-error: true # counted in the report; never stops the release
        run: node scripts/ci/run-check.mjs typecheck tsc "Type check" -- npx tsc -b
      - name: Dependency audit
        if: ${{ !cancelled() }}
        continue-on-error: true # counted in the report; never stops the release
        run: node scripts/ci/run-check.mjs audit audit "Dependency audit" -- npm audit --omit=dev --json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reports-static
          path: app/reports/
          if-no-files-found: ignore

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: app/.nvmrc, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - name: Unit tests
        if: ${{ !cancelled() }}
        continue-on-error: true # counted in the report; never stops the release
        run: node scripts/ci/run-check.mjs unit junit "Unit tests" -- node --test --test-reporter=junit --test-reporter-destination=reports/unit.xml --test-reporter=spec --test-reporter-destination=stdout "server/tests/unit/*.test.js"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reports-unit
          path: app/reports/
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'" --health-interval 5s --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/tac_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: app/.nvmrc, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - name: Integration tests
        if: ${{ !cancelled() }}
        continue-on-error: true # counted in the report; never stops the release
        run: node scripts/ci/run-check.mjs integration junit "Integration tests" -- node --test --test-reporter=junit --test-reporter-destination=reports/integration.xml --test-reporter=spec --test-reporter-destination=stdout --experimental-test-coverage --test-coverage-include="server/src/**" "server/tests/integration/*.test.js"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reports-integration
          path: app/reports/
          if-no-files-found: ignore

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'" --health-interval 5s --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/tac_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: app/.nvmrc, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run bundle
      - name: Browser tests
        if: ${{ !cancelled() }}
        continue-on-error: true # counted in the report; never stops the release
        run: node scripts/ci/run-check.mjs e2e junit "Browser tests" -- npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reports-e2e
          path: app/reports/
          if-no-files-found: ignore

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      # images are pushed only from main once the repository variable DEPLOY_ENABLED=true is set
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: app/.nvmrc }
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: app
          load: true
          tags: ci/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts read-only and answers (required)
        run: |
          set -euo pipefail
          docker run -d --name smoke --read-only --tmpfs /tmp -v /data -v /app/server/data -p 3000:3000 ci/app:ci
          s=starting
          for _ in $(seq 1 30); do s=$(docker inspect -f '{{.State.Health.Status}}' smoke); [ "$s" = healthy ] && break; sleep 2; done
          [ "$s" = healthy ] || { docker logs smoke; exit 1; }
          curl -fsS localhost:3000/ | grep -qi "<title>"
          curl -fsS localhost:3000/sitemap.xml | grep -q "<urlset"
          docker rm -f smoke
      - name: Image vulnerability scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci/app:ci
          severity: CRITICAL
          ignore-unfixed: true
          format: json
          output: app/trivy.json
          exit-code: "0"
      - name: Record scan result
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/ci/run-check.mjs image-scan trivy "Image vulnerability scan" -- cp trivy.json reports/image-scan.trivy.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with: { name: reports-build, path: app/reports/, if-no-files-found: ignore }
      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          platforms: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}
          tags: |
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE }}:latest
          cache-from: type=gha

  report:
    name: Error report
    needs: [static, unit, integration, e2e, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      errors: ${{ steps.summary.outputs.errors }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { pattern: reports-*, merge-multiple: true, path: app/reports }
      - id: summary
        run: node scripts/ci/summary.mjs reports typecheck,audit,unit,integration,e2e,image-scan
      - name: Warn on the run page
        if: steps.summary.outputs.errors != '0'
        run: echo "::warning title=Checks found errors::${{ steps.summary.outputs.errors }} error(s). See the run summary and the 'ci-errors' issue."
      - name: Open, update or close the tracking issue
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ERRORS: ${{ steps.summary.outputs.errors }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '\nCommit %s — [pipeline run](%s)\n' "${GITHUB_SHA::7}" "$RUN_URL" >> report.md
          gh label create ci-errors --color B60205 --description "Errors found by the pipeline" --force
          open=$(gh issue list --label ci-errors --state open --json number --jq '.[0].number // empty')
          if [ "$ERRORS" != 0 ]; then
            title="Pipeline found $ERRORS error(s) — fix in the next release"
            if [ -n "$open" ]; then gh issue edit "$open" --title "$title" --body-file report.md
            else gh issue create --title "$title" --label ci-errors --body-file report.md; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "All checks pass on ${GITHUB_SHA::7}. $RUN_URL"
          fi

  deploy:
    name: Deploy to production
    needs: [build, report]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true' && needs.build.result == 'success'
      && (vars.BLOCK_ON_ERRORS != 'true' || needs.report.outputs.errors == '0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production # add required reviewers in Settings → Environments for manual approval
    concurrency: { group: production-deploy, cancel-in-progress: false }
    defaults:
      run: { working-directory: . }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ssh-setup
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Bootstrap server (first run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bootstrap == 'true'
        run: |
          scp deploy/bootstrap-server.sh target:/tmp/bootstrap-server.sh
          ssh target 'sudo bash /tmp/bootstrap-server.sh "$(id -un)"'
      - name: Upload deployment files
        run: |
          ssh target 'test -d /opt/tac' || { echo "::error::/opt/tac missing — run this workflow manually once with bootstrap=true"; exit 1; }
          scp deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh target:/opt/tac/
          ssh target 'chmod +x /opt/tac/deploy.sh'
      - name: Docker Hub login on server
        env: { DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}" }
        run: |
          # shellcheck disable=SC2029  # value expanded client-side on purpose (a plain Docker Hub username)
          printf '%s' "$DOCKERHUB_TOKEN" | ssh target "docker login -u '$DOCKERHUB_USER' --password-stdin"
      - name: Deploy
        env:
          TAGS: TAG_C=${{ needs.build.outputs.tag }}
          # repository variable DEMO_MODE=true runs the public site as a demonstration on its own database and data folder
          DEMO_MODE: ${{ vars.DEMO_MODE == 'true' && 'true' || 'false' }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          ADMIN_PASSWORD: ${{ vars.DEMO_MODE == 'true' && secrets.DEMO_PASSWORD || secrets.ADMIN_PASSWORD }}
          MONGODB_URI: ${{ vars.DEMO_MODE == 'true' && secrets.DEMO_MONGODB_URI || secrets.MONGODB_URI }}
          ADMIN_EMAIL: ${{ vars.DEMO_MODE == 'true' && 'admin@demo.tac' || vars.ADMIN_EMAIL || 'admin@tacuae.com' }}
          APP_DATA_DIR: ${{ vars.DEMO_MODE == 'true' && '/data/demo' || '/data' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ENQUIRY_TO: ${{ vars.ENQUIRY_TO }}
          C_SITE: ${{ vars.C_SITE }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          # never let a demo fall back to the real database or to the password written in the code
          if [ "$DEMO_MODE" = true ]; then
            [ -n "$MONGODB_URI" ] && [ -n "$DEMO_PASSWORD" ] || { echo "::error::DEMO_MODE needs the secrets DEMO_MONGODB_URI and DEMO_PASSWORD"; exit 1; }
          fi
          payload=""
          for k in ADMIN_PASSWORD MONGODB_URI ADMIN_EMAIL SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM ENQUIRY_TO C_SITE DEMO_MODE DEMO_PASSWORD APP_DATA_DIR GOOGLE_CLIENT_ID FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_APP_ID; do
            v="${!k:-}"; [ -n "$v" ] && payload+="$k=$v"$'\n'
          done
          # shellcheck disable=SC2029  # tag/user are generated by the build job from fixed patterns
          printf '%s' "$payload" | ssh target "bash /opt/tac/deploy.sh --env-stdin DOCKERHUB_USER=$DOCKERHUB_USER $TAGS"
      - name: Add the demonstration data (first time only)
        if: vars.DEMO_MODE == 'true'
        run: ssh target 'cd /opt/tac && docker compose exec -T tac-c node server/scripts/seed-demo.mjs'
      - name: Verify the live site
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          LIVE_URL: ${{ vars.SMOKE_URL_C }}
        run: bash deploy/verify-live.sh "${LIVE_URL:-http://$SSH_HOST:8082}"
