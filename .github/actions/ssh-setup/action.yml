name: Configure SSH to the server
description: Creates the "target" SSH host used by the deploy and rollback jobs.
inputs:
  key: { required: true, description: Private key }
  host: { required: true, description: Server address }
  user: { required: false, description: Login user }
  known-hosts: { required: false, description: Pinned host key (recommended) }
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SSH_KEY: ${{ inputs.key }}
        SSH_HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.user }}
        KNOWN: ${{ inputs.known-hosts }}
      run: |
        set -euo pipefail
        [ -n "$SSH_KEY" ] && [ -n "$SSH_HOST" ] || { echo "::error::Set secrets SSH_PRIVATE_KEY and SSH_HOST"; exit 1; }
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy; chmod 600 ~/.ssh/id_deploy
        if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
        else echo "::warning::SSH_KNOWN_HOSTS not set — trusting the host key on first contact (set it to pin the server)"; ssh-keyscan -T 15 -H "$SSH_HOST" > ~/.ssh/known_hosts; fi
        printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 20\n' "$SSH_HOST" "${SSH_USER:-ubuntu}" > ~/.ssh/config
